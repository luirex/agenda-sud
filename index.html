<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Libro de Actas — Agenda Dominical (Firebase)</title>
<style>
  :root{
    --navy:#1B2A4A; --navy-deep:#12203A;
    --parchment:#FBF7EF; --parchment-dark:#F1EAD9;
    --ink:#2B2620; --ink-soft:#5C5445;
    --burgundy:#7A2E2E; --burgundy-dark:#5E2222;
    --gold:#A9832F; --sage:#4C6B4F; --line:#D9CDB2;
    --card-bg:#FFFFFF; --input-bg:#FFFEFB; --heading:#1B2A4A; --btn-sec-border:#1B2A4A;
    --font-display:Georgia,'Iowan Old Style','Palatino Linotype',serif;
    --font-body:'Segoe UI',Tahoma,system-ui,sans-serif;
    --font-mono:'SF Mono','Consolas',ui-monospace,monospace;
  }
  html[data-theme="dark"]{
    --parchment:#1E1B16; --parchment-dark:#2A2620;
    --ink:#EDE6D6; --ink-soft:#B9AF97; --line:#463F30;
    --card-bg:#26221C; --input-bg:#2E2A22;
    --heading:#D9B25B; --btn-sec-border:#6B6450;
  }
  html[data-font="sans"]{ --font-display:'Segoe UI',Tahoma,system-ui,sans-serif; --font-body:'Segoe UI',Tahoma,system-ui,sans-serif; }
  html[data-font="serif"]{ --font-display:Georgia,'Times New Roman',serif; --font-body:Georgia,'Times New Roman',serif; }
  html[data-fontsize="grande"]{ zoom:1.15; }
  html[data-fontsize="xl"]{ zoom:1.3; }
  html[data-theme="dark"] .toast{ background:#000; }
  .theme-toggle-btn{position:fixed;top:16px;right:16px;z-index:60;background:var(--card-bg);
    border:1px solid var(--line);border-radius:50%;width:42px;height:42px;cursor:pointer;
    font-size:17px;box-shadow:0 2px 10px rgba(0,0,0,.25);}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--navy);font-family:var(--font-body);color:var(--ink);}
  #app{display:flex;min-height:100vh;}
  #spine{width:220px;flex-shrink:0;background:linear-gradient(180deg,var(--navy),var(--navy-deep));
    color:#EDE6D6;display:flex;flex-direction:column;padding:28px 0;position:sticky;top:0;height:100vh;overflow-y:auto;}
  #spine .brand{padding:0 20px 20px;border-bottom:1px solid rgba(237,230,214,.15);margin-bottom:10px;}
  #spine .brand h1{font-family:var(--font-display);font-size:19px;margin:0 0 4px;}
  #spine .brand p{margin:0;font-size:11px;color:#B9AF97;font-style:italic;}
  .tab{display:block;width:100%;text-align:left;background:transparent;border:none;color:#D8CFB9;
    font-family:var(--font-body);font-size:14px;padding:14px 20px;cursor:pointer;border-left:3px solid transparent;}
  .tab:hover{background:rgba(255,255,255,.05);color:#fff;}
  .tab.active{background:var(--parchment);color:var(--navy-deep);border-left-color:var(--gold);
    font-weight:600;border-radius:0 8px 8px 0;margin-right:10px;}
  #spine .footer-note{margin-top:auto;padding:14px 20px 0;font-size:10.5px;color:#8D8468;border-top:1px solid rgba(237,230,214,.15);}
  #topbar{display:none;}
  #page{flex:1;background:var(--parchment);min-height:100vh;padding:36px 44px 80px;}
  .page-inner{max-width:920px;margin:0 auto;}
  h2.section-title{font-family:var(--font-display);font-size:27px;color:var(--heading);margin:0 0 4px;
    position:relative;padding-bottom:12px;}
  h2.section-title::after{content:'';display:block;width:46px;height:3px;background:var(--gold);
    margin-top:10px;border-radius:2px;}
  .verse{font-style:italic;color:var(--ink-soft);font-size:13px;border-left:3px solid var(--gold);padding-left:12px;margin:6px 0 24px;}
  .card-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:30px;}
  .choice-card{background:var(--parchment-dark);border:1px solid var(--line);border-radius:10px;padding:26px 22px;
    cursor:pointer;transition:transform .18s ease,box-shadow .18s ease;text-align:left;
    box-shadow:0 1px 3px rgba(27,42,74,.05);}
  .choice-card .icon{font-size:26px;display:block;margin-bottom:6px;}
  .choice-card:hover{transform:translateY(-4px);box-shadow:0 12px 24px rgba(27,42,74,.14);border-color:var(--gold);}
  .choice-card .tag{font-family:var(--font-mono);font-size:10.5px;letter-spacing:1px;color:var(--gold);text-transform:uppercase;}
  .choice-card h3{font-family:var(--font-display);font-size:20px;margin:6px 0 8px;color:var(--heading);}
  .choice-card p{margin:0;font-size:13px;color:var(--ink-soft);line-height:1.5;}
  .hero-cover{background:var(--navy);color:#EDE6D6;border-radius:8px;padding:44px 40px;margin-bottom:6px;
    background-image:radial-gradient(circle at top right, rgba(169,131,47,.25), transparent 60%);}
  .hero-cover .eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:2px;color:var(--gold);text-transform:uppercase;}
  .hero-cover h1{font-family:var(--font-display);font-size:34px;margin:8px 0 10px;}
  .hero-cover p{margin:0;color:#C9C0A9;font-size:14px;max-width:520px;}
  fieldset{border:1px solid var(--line);border-radius:10px;padding:20px 22px 22px;margin:0 0 22px;
    background:var(--card-bg);box-shadow:0 1px 4px rgba(27,42,74,.05);}
  legend{font-family:var(--font-display);font-size:14.5px;color:var(--heading);padding:3px 12px;
    background:var(--parchment-dark);border-radius:20px;border:1px solid var(--line);}
  label{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-soft);margin-bottom:4px;}
  input[type=text],input[type=date],input[type=time],textarea,select{
    width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:4px;font-family:var(--font-body);
    font-size:14px;color:var(--ink);background:var(--input-bg);margin-bottom:12px;}
  textarea{resize:vertical;min-height:56px;}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--gold);outline-offset:1px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
  .row-full{margin-bottom:0;}
  .list-row{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px;}
  .list-row input,.list-row textarea{margin-bottom:0;}
  .btn-remove{flex-shrink:0;background:none;border:1px solid var(--line);color:var(--burgundy);border-radius:4px;
    width:32px;height:34px;cursor:pointer;font-size:14px;}
  .btn-remove:hover{background:var(--burgundy);color:#fff;border-color:var(--burgundy);}
  .btn-add{margin-top:2px;background:none;border:1px dashed var(--gold);color:var(--heading);border-radius:4px;
    padding:8px 14px;font-size:13px;cursor:pointer;}
  .btn-add:hover{background:var(--parchment-dark);}
  .discursante-card{border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin-bottom:14px;background:var(--input-bg);position:relative;box-shadow:0 1px 3px rgba(27,42,74,.05);}
  .discursante-card .num{font-family:var(--font-mono);font-size:11px;color:var(--gold);letter-spacing:1px;}
  .lookup{font-size:12px;color:var(--sage);font-style:italic;margin:-6px 0 10px;min-height:16px;}
  .lookup.none{color:var(--ink-soft);}
  .himno-especial-block{background:var(--parchment-dark);border:1px dashed var(--gold);border-radius:6px;
    padding:12px 16px;margin:4px 0 12px;}
  .himno-especial-block label{color:var(--heading);}
  .himno-especial-block input{margin-bottom:0;}
  .actions-row{display:flex;gap:12px;align-items:center;margin-top:8px;flex-wrap:wrap;}
  .btn-primary{background:var(--burgundy);color:#fff;border:none;padding:12px 24px;border-radius:7px;
    font-size:14.5px;cursor:pointer;font-family:var(--font-body);font-weight:600;
    box-shadow:0 2px 6px rgba(122,46,46,.25);transition:transform .12s,box-shadow .12s,background .15s;}
  .btn-primary:active{transform:translateY(1px);}
  .btn-primary:hover{background:var(--burgundy-dark);}
  .btn-secondary{background:transparent;border:1px solid var(--btn-sec-border);color:var(--heading);padding:11px 20px;
    border-radius:7px;font-size:14px;cursor:pointer;transition:background .15s,color .15s;}
  .btn-secondary:hover{background:var(--navy);color:#fff;}
  .save-status{font-size:12px;color:var(--sage);font-style:italic;}
  .hint{font-size:12px;color:var(--ink-soft);margin:-8px 0 12px;font-style:italic;}
  .log-item{border:1px solid var(--line);border-radius:8px;background:var(--card-bg);margin-bottom:14px;overflow:hidden;box-shadow:0 1px 3px rgba(27,42,74,.05);}
  .log-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;cursor:pointer;background:var(--parchment-dark);}
  .log-head .tipo{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.6px;color:var(--gold);text-transform:uppercase;}
  .log-head .fecha{font-family:var(--font-display);font-size:16px;color:var(--heading);}
  .log-body{padding:16px 20px;display:none;}
  .log-body.open{display:block;}
  .log-actions{padding:10px 18px 20px;border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap;}
  .discursante-row{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);
    padding:12px 4px;gap:12px;}
  .discursante-row:last-child{border-bottom:none;}
  .discursante-row .nombre{font-family:var(--font-display);font-size:16px;color:var(--heading);}
  .discursante-row .meta{font-size:12.5px;color:var(--ink-soft);}
  .discursante-row .last{text-align:right;font-size:12.5px;color:var(--sage);font-style:italic;}
  .empty-state{padding:40px 20px;text-align:center;color:var(--ink-soft);}
  .empty-state h3{font-family:var(--font-display);color:var(--heading);margin-bottom:6px;}
  .toast{position:fixed;bottom:24px;right:24px;background:var(--navy);color:#EDE6D6;padding:12px 20px;
    border-radius:6px;font-size:13.5px;box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0;transform:translateY(10px);
    transition:opacity .25s,transform .25s;pointer-events:none;z-index:50;}
  .toast.show{opacity:1;transform:translateY(0);}
  .pill-count{display:inline-block;background:var(--gold);color:#fff;border-radius:20px;font-size:11px;
    padding:2px 9px;margin-left:8px;font-family:var(--font-mono);}
  .filter-row{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .filter-btn{background:var(--card-bg);border:1px solid var(--line);border-radius:20px;padding:7px 15px;font-size:12.5px;
    cursor:pointer;color:var(--ink-soft);font-family:var(--font-body);}
  .filter-btn:hover{border-color:var(--gold);}
  .filter-btn.active{background:var(--navy);color:#fff;border-color:var(--heading);}
  .semaforo{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;flex-shrink:0;}
  .semaforo.verde{background:#4C6B4F;}
  .semaforo.naranja{background:#C97A2B;}
  .semaforo.rojo{background:#B23A3A;}
  .discursante-row .last{text-align:right;}
  .last-line{display:flex;align-items:center;justify-content:flex-end;}
  .list-num{font-family:var(--font-mono);font-size:13px;color:var(--gold);flex-shrink:0;
    width:22px;padding-top:9px;text-align:right;}
  .gate-wrap{display:flex;align-items:center;justify-content:center;min-height:80vh;padding:20px;}
  .gate-card{background:var(--card-bg);border:1px solid var(--line);border-radius:12px;padding:44px 38px;max-width:420px;width:100%;text-align:center;box-shadow:0 8px 30px rgba(27,42,74,.12);}
  .gate-card h1{font-family:var(--font-display);color:var(--heading);font-size:26px;margin:0 0 6px;}
  .gate-card input{text-align:center;font-size:16px;letter-spacing:1px;}
  .admin-barrio-card{border:1px solid var(--line);border-radius:8px;padding:14px 18px;margin-bottom:10px;
    background:var(--card-bg);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 1px 3px rgba(27,42,74,.05);}
  .admin-code{font-family:var(--font-mono);background:var(--parchment-dark);padding:3px 10px;border-radius:4px;
    font-size:12.5px;letter-spacing:.5px;display:inline-block;margin-top:4px;}
  .code-box{background:var(--parchment-dark);border:1px dashed var(--gold);border-radius:6px;padding:12px 16px;
    display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap;}
  .fechas-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .fecha-pill{background:var(--parchment-dark);border:1px solid var(--line);color:var(--ink-soft);
    font-family:var(--font-mono);font-size:11.5px;padding:3px 9px;border-radius:20px;cursor:default;}
  .semaforo-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
  .semaforo-col{border:1px solid var(--line);border-radius:8px;padding:14px 16px;background:var(--input-bg);}
  .semaforo-col-rojo{border-top:3px solid #B23A3A;}
  .semaforo-col-naranja{border-top:3px solid #C97A2B;}
  .semaforo-col-verde{border-top:3px solid #4C6B4F;}
  .semaforo-col-head{display:flex;align-items:center;font-family:var(--font-display);font-size:15.5px;color:var(--heading);}
  .semaforo-item{padding:9px 0;border-bottom:1px solid var(--line);}
  .semaforo-item:last-child{border-bottom:none;}
  @media (max-width:860px){ .semaforo-grid{grid-template-columns:1fr;} }
  @media (max-width:860px){
    #app{flex-direction:column;}
    #spine{display:none;}
    #topbar{display:flex;overflow-x:auto;background:var(--navy);position:sticky;top:0;z-index:20;}
    #topbar .tab{white-space:nowrap;border-left:none;}
    #topbar .tab.active{border-radius:8px 8px 0 0;margin-right:0;}
    #page{padding:22px 16px 60px;}
    .card-grid,.grid3{grid-template-columns:1fr 1fr;}
    .grid2{grid-template-columns:1fr;}
    input[type=text],input[type=date],input[type=time],textarea,select{font-size:16px;}
    .theme-toggle-btn{top:auto;bottom:16px;}
  }
  @media (max-width:520px){
    .card-grid,.grid2,.grid3{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<button id="theme-toggle" class="theme-toggle-btn" onclick="toggleTheme()" title="Cambiar tema" aria-label="Cambiar tema">🌙</button>
<div id="app">
  <nav id="spine"></nav>
  <nav id="topbar"></nav>
  <main id="page"><div class="page-inner" id="pageInner"></div></main>
</div>
<div class="toast" id="toast"></div>

<script type="module">
/* ============ FIREBASE ============ */
import { initializeApp, deleteApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {
  getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut,
  createUserWithEmailAndPassword, setPersistence, browserLocalPersistence,
  updatePassword, EmailAuthProvider, reauthenticateWithCredential
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc,
  collection, addDoc, getDocs, onSnapshot, query, orderBy, arrayUnion, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAbbsJqXeiw-gv613LQSijuMaryd4DXjgY",
  authDomain: "sistema-de-reuniones-ad45e.firebaseapp.com",
  projectId: "sistema-de-reuniones-ad45e",
  storageBucket: "sistema-de-reuniones-ad45e.firebasestorage.app",
  messagingSenderId: "946651821695",
  appId: "1:946651821695:web:da87c95e9e28a7cee8b14a"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
await setPersistence(auth, browserLocalPersistence);

/* ============ UTILIDADES ============ */
const qs = id => document.getElementById(id);
function escapeAttr(s){ return (s||'').toString().replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function escapeHtml(s){ return (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtFecha(f){
  if(!f) return 'Sin fecha';
  const [y,m,d] = f.split('-');
  if(!y||!m||!d) return f;
  return `${d}/${m}/${y}`;
}
let toastTimer=null;
function toast(msg){
  const t=qs('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2500);
}
function debounce(fn,ms){let t;return (...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms);};}
function slugify(nombre){
  return (nombre||'BARRIO').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,14) || 'BARRIO';
}
function generarCodigo(nombre){
  const rand = Math.random().toString(36).slice(2,6).toUpperCase();
  return `${slugify(nombre)}-${rand}`;
}

/* ============ TEMA (claro/oscuro) — preferencia local del dispositivo ============ */
function initTheme(){
  const saved = localStorage.getItem('preferencia-tema') || 'light';
  aplicarTema(saved);
}
function aplicarTema(tema){
  document.documentElement.setAttribute('data-theme', tema);
  const btn = qs('theme-toggle');
  if(btn) btn.textContent = tema==='dark' ? '☀️' : '🌙';
}
window.toggleTheme = function(){
  const actual = document.documentElement.getAttribute('data-theme')==='dark' ? 'dark':'light';
  const nuevo = actual==='dark' ? 'light' : 'dark';
  aplicarTema(nuevo);
  localStorage.setItem('preferencia-tema', nuevo);
};
initTheme();

/* ============ MODELOS POR DEFECTO ============ */
function defaultDominical(){
  return {
    barrioRama:'', fecha:'', hora:'',
    preside:'', dirige:'', pianista:'', direccionMusica:'',
    bienvenida:'',
    primerHimno:'', primeraOracion:'',
    anuncios:['',''],
    asuntosBarrio:['','',''],
    confirmacionNuevosMiembros:'',
    himnoSacramental:'',
    santaCenaFrase:'Bendicen y reparten los poseedores del Sacerdocio',
    discursantes:[{nombre:'',tiempo:'',tema:''},{nombre:'',tiempo:'',tema:''},{nombre:'',tiempo:'',tema:''},{nombre:'',tiempo:'',tema:''}],
    himnoEspecial:'',
    agradecimientos:['','',''],
    himnoFinal:'', ultimaOracion:'',
    asistencia:'', finalizo:'',
    observaciones:''
  };
}
function defaultAyuno(){
  return {
    barrio:'', fecha:'', hora:'',
    preside:'', dirige:'', pianista:'', direccionMusica:'',
    bienvenida:'',
    anuncios:['',''],
    primerHimno:'', primeraOracion:'',
    asuntosBarrio:['','',''],
    confirmacionMiembrosNuevos:['','',''],
    himnoSacramental:'',
    santaCenaFrase:'Bendicen y reparten los poseedores del Sacerdocio',
    testimoniantes:[''],
    testimoniosNotas:'',
    agradecimientos:['','',''],
    himnoFinal:'', oracionFinal:'',
    asistencia:'', finalizo:'',
    observaciones:''
  };
}
function defaultConfig(){ return {nombresLideres:[]}; }
window.defaultDominical = defaultDominical;
window.defaultAyuno = defaultAyuno;

/* ============ ESTADO GLOBAL ============ */
const state = {
  stage:'loading', // 'gate' | 'admin' | 'app'
  authUser:null,
  isAdmin:false,
  barrioId:null,
  barrioNombre:'',
  view:'home',
  config: defaultConfig(),
  dominical:null, ayuno:null,
  log:[], registry:{},
  familiasData:{list:[], resetBoundary:null},
  openLogIds:new Set(),
  unsubs:[] // listeners activos para limpiar al cambiar de barrio
};
window.state = state;

/* ---- referencias de Firestore por barrio ---- */
function refDominical(){ return doc(db,'barrios',state.barrioId,'estado','dominical'); }
function refAyuno(){ return doc(db,'barrios',state.barrioId,'estado','ayuno'); }
function refFamilias(){ return doc(db,'barrios',state.barrioId,'estado','familias'); }
function refConfig(){ return doc(db,'barrios',state.barrioId,'estado','config'); }
function colReuniones(){ return collection(db,'barrios',state.barrioId,'reuniones'); }
function colDiscursantes(){ return collection(db,'barrios',state.barrioId,'discursantes'); }

const saveDominical = debounce(()=>setDoc(refDominical(), state.dominical, {merge:true}).catch(onSaveError), 500);
const saveAyuno = debounce(()=>setDoc(refAyuno(), state.ayuno, {merge:true}).catch(onSaveError), 500);
window.saveDominical = saveDominical;
window.saveAyuno = saveAyuno;
const saveFamilias = debounce(()=>setDoc(refFamilias(), state.familiasData, {merge:true}).catch(onSaveError), 400);
const saveConfig = debounce(()=>setDoc(refConfig(), state.config, {merge:true}).catch(onSaveError), 400);
function onSaveError(e){
  console.error('Error al guardar', e);
  if(!state.saveErrorNotified){ state.saveErrorNotified = true; toast('⚠️ No se pudo guardar. Revisa tu conexión.'); }
}

/* ---- reinicio semanal de familias (domingo 11:59pm) ---- */
function getLastSundayBoundary(now){
  const day = now.getDay();
  const cand = new Date(now.getFullYear(), now.getMonth(), now.getDate()-day, 23,59,0,0);
  if(cand.getTime() > now.getTime()) cand.setDate(cand.getDate()-7);
  return cand;
}
function checkFamiliasReset(){
  const now = new Date();
  const boundary = getLastSundayBoundary(now);
  const stored = state.familiasData.resetBoundary ? new Date(state.familiasData.resetBoundary) : null;
  if(!stored || stored.getTime() < boundary.getTime()){
    state.familiasData.list = [];
    state.familiasData.resetBoundary = boundary.toISOString();
    saveFamilias();
  }
}

/* ============ AUTENTICACIÓN Y SESIÓN ============ */
function limpiarListeners(){
  state.unsubs.forEach(u=>{ try{u();}catch(e){} });
  state.unsubs = [];
}

async function cargarSesionBarrio(barrioId, nombre){
  state.barrioId = barrioId;
  state.barrioNombre = nombre || '';

  const [configSnap, domSnap, ayuSnap, famSnap] = await Promise.all([
    getDoc(refConfig()), getDoc(refDominical()), getDoc(refAyuno()), getDoc(refFamilias())
  ]);
  state.config = Object.assign(defaultConfig(), configSnap.exists()? configSnap.data() : {});
  state.dominical = Object.assign(defaultDominical(), domSnap.exists()? domSnap.data() : {barrioRama: nombre});
  state.ayuno = Object.assign(defaultAyuno(), ayuSnap.exists()? ayuSnap.data() : {barrio: nombre});
  state.familiasData = Object.assign({list:[],resetBoundary:null}, famSnap.exists()? famSnap.data() : {});
  checkFamiliasReset();

  limpiarListeners();
  state.unsubs.push(onSnapshot(query(colReuniones(), orderBy('archivedAt','desc')), snap=>{
    state.log = snap.docs.map(d=>({id:d.id, ...d.data()}));
    if(state.stage==='app' && state.view==='reuniones') render();
    if(state.stage==='app' && state.view==='home') render();
  }));
  state.unsubs.push(onSnapshot(colDiscursantes(), snap=>{
    const reg = {};
    snap.docs.forEach(d=>{ reg[d.id] = d.data(); });
    state.registry = reg;
    if(state.stage==='app' && (state.view==='discursantes' || state.view==='dominical')) render();
  }));

  state.stage='app'; state.view='home';
  render();
}

async function cargarSesion(user){
  state.authUser = user;
  const [adminSnap, usuarioSnap] = await Promise.all([
    getDoc(doc(db,'admins',user.uid)),
    getDoc(doc(db,'usuarios',user.uid))
  ]);
  state.isAdmin = adminSnap.exists();

  if(usuarioSnap.exists()){
    const datos = usuarioSnap.data();
    await cargarSesionBarrio(datos.barrioId, datos.nombre);
  } else if(state.isAdmin){
    state.stage='admin'; render();
  } else {
    state.stage='sin-acceso'; render();
  }
}
window.cargarSesion = cargarSesion;

onAuthStateChanged(auth, async (user)=>{
  if(user){ await cargarSesion(user); }
  else { limpiarListeners(); state.stage='gate'; state.view='home'; render(); }
});

window.crearBarrio = async function(){
  const nombre = qs('admin-nombre-barrio').value.trim();
  const emailInput = qs('admin-email-barrio').value.trim();
  const passInput = qs('admin-pass-barrio').value;
  if(!nombre){ alert('Escribe el nombre del barrio o rama.'); return; }
  const barrioId = generarCodigo(nombre);
  const email = emailInput || `${slugify(nombre).toLowerCase()}@barrios.app`;
  const pass = passInput || Math.random().toString(36).slice(2,10);
  if(pass.length<6){ alert('La contraseña debe tener al menos 6 caracteres.'); return; }

  const btn = qs('crear-barrio-btn'); if(btn){ btn.disabled=true; btn.textContent='Creando...'; }
  try{
    const secondaryApp = initializeApp(firebaseConfig, 'secundaria-'+Date.now());
    const secondaryAuth = getAuth(secondaryApp);
    const cred = await createUserWithEmailAndPassword(secondaryAuth, email, pass);
    const uid = cred.user.uid;
    await signOut(secondaryAuth);
    await deleteApp(secondaryApp);

    await setDoc(doc(db,'barrios',barrioId), {nombre, email, uid, creadoEn:new Date().toISOString()});
    await setDoc(doc(db,'usuarios',uid), {barrioId, nombre, creadoEn:new Date().toISOString()});

    render();
    alert(`Barrio creado.\n\nComparte estos datos con ellos:\n\nCorreo: ${email}\nContraseña: ${pass}`);
  }catch(e){
    alert('No se pudo crear el barrio: '+(e.message||e));
  } finally {
    if(btn){ btn.disabled=false; btn.textContent='Crear barrio'; }
  }
};
window.eliminarAccesoBarrio = async function(barrioId, nombre){
  if(!confirm(`¿Revocar el acceso de "${nombre}"? Ya no podrán iniciar sesión. Sus datos guardados permanecen en la base de datos.`)) return;

    if(barrioSnap.exists() && barrioSnap.data().uid){

function slugPersona(nombre){
  return (nombre||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || 'sin-nombre';
}

const listManagers = {};
window.listManagers = listManagers;
function makeSimpleList(containerId, getArr, placeholder, onSave, minRows, numbered){
  minRows = minRows||0;
  const mgr = {
    render(){
      const arr = getArr();
      qs(containerId).innerHTML = arr.map((val,idx)=>`
        <div class="list-row">
          ${numbered?`<span class="list-num">${idx+1}.</span>`:''}
          <input type="text" value="${escapeAttr(val)}" placeholder="${placeholder}"
            oninput="listManagers['${containerId}'].update(${idx}, this.value)">
          ${arr.length>minRows ? `<button type="button" class="btn-remove" onclick="listManagers['${containerId}'].remove(${idx})" aria-label="Eliminar">&#10005;</button>` : ''}
        </div>`).join('') + `<button type="button" class="btn-add" onclick="listManagers['${containerId}'].add()">+ Agregar</button>`;
    },
    update(idx,val){ getArr()[idx]=val; onSave(); },
    add(){ getArr().push(''); mgr.render(); onSave(); },
    remove(idx){ getArr().splice(idx,1); mgr.render(); onSave(); }
  };
  listManagers[containerId]=mgr;
  return mgr;
}

/* ============ GESTOR DE DISCURSANTES (con himno especial tras el 2º) ============ */
function makeDiscursantesList(containerId, getArr, onSave, prefix, getHimno){
  const mgr = {
    render(){
      const arr = getArr();
      let html = '';
      arr.forEach((d,idx)=>{
        const info = lookupUltimoDiscurso(d.nombre);
        html += `
        <div class="discursante-card">
          <div class="num">DISCURSANTE ${idx+1}</div>
          <div class="grid3">
            <div><label>Nombre</label>
              <input type="text" list="discursantes-datalist" value="${escapeAttr(d.nombre)}" placeholder="Nombre completo"
                oninput="listManagers['${containerId}'].update(${idx},'nombre',this.value)"></div>
            <div><label>Tiempo asignado</label>
              <input type="text" value="${escapeAttr(d.tiempo)}" placeholder="ej. 8 min"
                oninput="listManagers['${containerId}'].update(${idx},'tiempo',this.value)"></div>
            <div><label>Tema</label>
              <input type="text" value="${escapeAttr(d.tema)}" placeholder="Tema del discurso"
                oninput="listManagers['${containerId}'].update(${idx},'tema',this.value)"></div>
          </div>
          <div class="lookup ${info?'':'none'}" id="lookup-${containerId}-${idx}">${info}</div>
          ${arr.length>1?`<button type="button" class="btn-remove" onclick="listManagers['${containerId}'].remove(${idx})" style="position:absolute;top:12px;right:12px;">&#10005;</button>`:''}
        </div>`;
        if(idx===1){
          html += `<div class="himno-especial-block">
            <label>Himno especial No.</label>
            <input type="text" value="${escapeAttr(getHimno())}" placeholder="Número de himno"
              oninput="fieldUpdate('${prefix}','himnoEspecial',this.value)">
          </div>`;
        }
      });
      html += `<button type="button" class="btn-add" onclick="listManagers['${containerId}'].add()">+ Agregar discursante</button>`;
      qs(containerId).innerHTML = html;
    },
    update(idx, field, val){
      getArr()[idx][field]=val;
      if(field==='nombre'){
        const el = qs(`lookup-${containerId}-${idx}`);
        const info = lookupUltimoDiscurso(val);
        if(el){ el.textContent = info; el.className = 'lookup '+(info?'':'none'); }
      }
      onSave();
    },
    add(){ getArr().push({nombre:'',tiempo:'',tema:''}); mgr.render(); onSave(); },
    remove(idx){ getArr().splice(idx,1); mgr.render(); onSave(); }
  };
  listManagers[containerId]=mgr;
  return mgr;
}
function lookupUltimoDiscurso(nombre){
  if(!nombre || !nombre.trim()) return '';
  const key = slugPersona(nombre);
  const entry = state.registry[key];
  if(!entry || !entry.historial || !entry.historial.length) return 'Sin discursos previos registrados';
  const historialOrdenado = entry.historial.slice().sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));
  const u = historialOrdenado[0];
  return `Último discurso: ${fmtFecha(u.fecha)}${u.tiempo? ' · '+u.tiempo:''}${u.tema? ' · "'+u.tema+'"':''}`;
}

  makeSimpleList(`${prefix}-asuntos`, ()=>d.asuntosBarrio, kind==='dominical'?'Asunto de barrio / rama':'Asunto de barrio', onSave, 0).render();

    'Nombre de la familia', prefix.startsWith('log-') ? onSave : saveFamilias, 0).render();

/* ============ FINALIZAR / ARCHIVAR ============ */
window.finalizarDominical = async function(){
  const d = state.dominical;
  if(!d.fecha){ alert('Ingresa la fecha de la reunión antes de archivarla.'); return; }
  const dataSnapshot = JSON.parse(JSON.stringify(d));
  dataSnapshot.familiasNoAsistieron = [...state.familiasData.list];
  try{
    await addDoc(colReuniones(), {tipo:'Reunión Sacramental Dominical', fecha:d.fecha, archivedAt:new Date().toISOString(), data:dataSnapshot});
    for(const dc of d.discursantes){
      if(dc.nombre && dc.nombre.trim()){
        const ref = doc(colDiscursantes(), slugPersona(dc.nombre));
        await setDoc(ref, {
          nombre: dc.nombre.trim(),
          historial: arrayUnion({fecha:d.fecha, tiempo:dc.tiempo||'', tema:dc.tema||''})
        }, {merge:true});
      }
    }
    state.dominical = defaultDominical();
    state.dominical.barrioRama = state.barrioNombre;
    await setDoc(refDominical(), state.dominical);
    render();
    toast('Reunión archivada. Puedes editarla desde la Bitácora de Reuniones si es necesario.');
  }catch(e){
    alert('No se pudo archivar la reunión: '+(e.message||e));
  }
};
window.finalizarAyuno = async function(){
  const a = state.ayuno;
  if(!a.fecha){ alert('Ingresa la fecha de la reunión antes de archivarla.'); return; }
  const dataSnapshot = JSON.parse(JSON.stringify(a));
  dataSnapshot.familiasNoAsistieron = [...state.familiasData.list];
  try{
    await addDoc(colReuniones(), {tipo:'Reunión de Ayuno y Testimonio', fecha:a.fecha, archivedAt:new Date().toISOString(), data:dataSnapshot});
    state.ayuno = defaultAyuno();
    state.ayuno.barrio = state.barrioNombre;
    await setDoc(refAyuno(), state.ayuno);
    render();
    toast('Reunión archivada. Puedes editarla desde la Bitácora de Reuniones si es necesario.');
  }catch(e){
    alert('No se pudo archivar la reunión: '+(e.message||e));
  }
};

/* ============ BITÁCORA DE DISCURSANTES ============ */
function monthsAgoDate(n){ const dd=new Date(); dd.setMonth(dd.getMonth()-n); dd.setHours(0,0,0,0); return dd; }
function estadoSemaforo(fechaStr){
  const last = new Date(fechaStr+'T00:00:00');
  const dosMeses = monthsAgoDate(2);
  const cuatroMeses = monthsAgoDate(4);
  if(last > dosMeses) return {color:'verde', label:'Reciente'};
  if(last >= cuatroMeses) return {color:'naranja', label:'Moderado'};
  return {color:'rojo', label:'Prioritario'};
}
function renderDiscursantes(){
  const entries = Object.values(state.registry).filter(e=>e.historial && e.historial.length);
  if(!entries.length){
    return `<h2 class="section-title">Bitácora de Discursantes</h2>
    <p class="verse">Historial de discursantes registrados desde la Reunión Sacramental Dominical.</p>
    <div class="empty-state"><h3>Todavía no hay discursantes registrados</h3>
    <p>Agrega discursantes en la Reunión Sacramental Dominical y, al archivar la reunión, aparecerán aquí.</p></div>`;
  }
  entries.forEach(e=> e.historial.sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||'')) );
  const conEstado = entries.map(e=>({e, est: estadoSemaforo(e.historial[0].fecha)}));

  const generalOrdenado = conEstado.slice().sort((a,b)=>a.e.nombre.localeCompare(b.e.nombre));
  const generalRows = generalOrdenado.map(({e,est})=>{
    const fechas = e.historial.map(h=>`<span class="fecha-pill" title="${escapeAttr(h.tema||'')}${h.tiempo?' · '+escapeAttr(h.tiempo):''}">${fmtFecha(h.fecha)}</span>`).join('');
    return `<div class="discursante-row">
      <div>
        <div class="nombre"><span class="semaforo ${est.color}"></span>${escapeHtml(e.nombre)}</div>
        <div class="meta">${e.historial.length} discurso(s) registrado(s)</div>
        <div class="fechas-wrap">${fechas}</div>
      </div>
    </div>`;
  }).join('');

  const grupos = {rojo:[], naranja:[], verde:[]};
  conEstado.forEach(item=>grupos[item.est.color].push(item));
  grupos.rojo.sort((a,b)=> (a.e.historial[0].fecha||'').localeCompare(b.e.historial[0].fecha||''));
  grupos.naranja.sort((a,b)=> (a.e.historial[0].fecha||'').localeCompare(b.e.historial[0].fecha||''));
  grupos.verde.sort((a,b)=> (b.e.historial[0].fecha||'').localeCompare(a.e.historial[0].fecha||''));

  function columnaSemaforo(color, titulo, subtitulo, lista){
    const items = lista.length ? lista.map(({e})=>{
      const u = e.historial[0];
      return `<div class="semaforo-item">
        <div class="nombre" style="font-size:14.5px;">${escapeHtml(e.nombre)}</div>
        <div class="meta">Último: ${fmtFecha(u.fecha)}${u.tiempo? ' · '+escapeHtml(u.tiempo):''}</div>
      </div>`;
    }).join('') : `<p class="hint" style="margin:6px 0 0;">Nadie en este grupo.</p>`;
    return `<div class="semaforo-col semaforo-col-${color}">
      <div class="semaforo-col-head"><span class="semaforo ${color}"></span>${titulo}<span class="pill-count">${lista.length}</span></div>
      <p class="hint" style="margin:2px 0 10px;">${subtitulo}</p>
      ${items}
    </div>`;
  }

  return `<h2 class="section-title">Bitácora de Discursantes</h2>
  <p class="verse">Se actualiza en vivo entre todos los que usen este barrio.</p>
  <fieldset>
    <legend>General — todas las fechas por persona (${entries.length})</legend>
    ${generalRows}
  </fieldset>
  <fieldset>
    <legend>Semaforizado por tiempo desde su último discurso</legend>
    <div class="semaforo-grid">
      ${columnaSemaforo('rojo','Prioritario','Más de 4 meses', grupos.rojo)}
      ${columnaSemaforo('naranja','Moderado','De 2 a 4 meses', grupos.naranja)}
      ${columnaSemaforo('verde','Reciente','Menos de 2 meses', grupos.verde)}
    </div>
  </fieldset>`;
}

/* ============ BITÁCORA DE REUNIONES (editable, en vivo) ============ */
const logSaveDebouncers = {};
function getLogSaver(id){
  if(!logSaveDebouncers[id]){
    logSaveDebouncers[id] = debounce(()=>{
      const entry = state.log.find(e=>e.id===id);
      if(entry) setDoc(doc(colReuniones(), id), {data: entry.data}, {merge:true}).catch(onSaveError);
    }, 500);
  }
  return logSaveDebouncers[id];
}
window.toggleLog = function(id){
  if(state.openLogIds.has(id)) state.openLogIds.delete(id); else state.openLogIds.add(id);
  render();
};
window.eliminarLog = async function(id){
  if(!confirm('¿Eliminar esta reunión del archivo? Esta acción no se puede deshacer.')) return;
  try{ await deleteDoc(doc(colReuniones(), id)); state.openLogIds.delete(id); toast('Reunión eliminada del archivo'); }
  catch(e){ alert('No se pudo eliminar: '+(e.message||e)); }
};
window.guardarLogAhora = async function(id){
  const entry = state.log.find(e=>e.id===id);
  if(!entry) return;
  try{ await setDoc(doc(colReuniones(), id), {data: entry.data}, {merge:true}); toast('Cambios guardados en la reunión archivada'); }
  catch(e){ alert('No se pudo guardar: '+(e.message||e)); }
};
function renderReuniones(){
  if(!state.log.length){
    return `<h2 class="section-title">Bitácora de Reuniones</h2>
    <p class="verse">Archivo de todas las reuniones ya realizadas.</p>
    <div class="empty-state"><h3>Todavía no hay reuniones archivadas</h3>
    <p>Cuando finalices una Reunión Sacramental Dominical o de Ayuno y Testimonio, quedará guardada aquí.</p></div>`;
  }
  const items = state.log.map(entry=>{
    const open = state.openLogIds.has(entry.id);
    const prefix = `log-${entry.id}`;
    const inner = open
      ? (entry.tipo==='Reunión Sacramental Dominical' ? fieldsetsDominical(prefix, entry.data, getLogSaver(entry.id)) : fieldsetsAyuno(prefix, entry.data, getLogSaver(entry.id)))
      : '';
    return `<div class="log-item">
      <div class="log-head" onclick="toggleLog('${entry.id}')">
        <div><div class="tipo">${escapeHtml(entry.tipo)}</div><div class="fecha">${fmtFecha(entry.fecha)}</div></div>
        <div>${open?'▲':'▼'}</div>
      </div>
      <div class="log-body ${open?'open':''}">${inner}</div>
      ${open?`<div class="log-actions">
        <button type="button" class="btn-primary" onclick="guardarLogAhora('${entry.id}')">Guardar cambios</button>
        <button type="button" class="btn-secondary" onclick="eliminarLog('${entry.id}')">Eliminar del archivo</button>
      </div>`:''}
    </div>`;
  }).join('');
  return `<h2 class="section-title">Bitácora de Reuniones</h2>
  <p class="verse">${state.log.length} reunión(es) archivada(s). Toca una para ver y editar el detalle completo.</p>
  ${items}`;
}
function bindOpenLogLists(){
  state.log.forEach(entry=>{
    if(!state.openLogIds.has(entry.id)) return;
    const prefix = `log-${entry.id}`;
    const kind = entry.tipo==='Reunión Sacramental Dominical' ? 'dominical':'ayuno';
    bindMeetingLists(prefix, entry.data, kind, getLogSaver(entry.id));
  });
}
